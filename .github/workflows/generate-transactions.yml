name: Generate Transactions

on:
  push:
    branches:
      - main

  # Run manually from the Actions tab
  workflow_dispatch:
    inputs:
      tx_count:
        description: "Number of transactions to send"
        required: false
        default: "500"
      delay_ms:
        description: "Delay between transactions (ms)"
        required: false
        default: "5000"
      network:
        description: "Stacks network"
        required: false
        default: "mainnet"
        type: choice
        options:
          - mainnet
          - testnet
  # Optional: run on a schedule (e.g. daily at 08:00 UTC)
  # schedule:
  #   - cron: "0 8 * * *"

jobs:
  generate-transactions:
    name: Mint ${{ inputs.tx_count || '100' }} STAD transactions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generate-transactions script
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          RECIPIENT_ADDRESS: ${{ secrets.RECIPIENT_ADDRESS }}
          STACKS_NETWORK: ${{ inputs.network || 'mainnet' }}
          TX_COUNT: ${{ inputs.tx_count || '100' }}
          DELAY_MS: ${{ inputs.delay_ms || '5000' }}
          PAUSE_ON_RATE_LIMIT_MS: "30000"
          FEE: "6000"
        run: pnpm gen-txs
